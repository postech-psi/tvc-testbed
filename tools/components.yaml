# Point masses NOT modeled as CAD solids -- electronics, wiring, fasteners.
# Structural parts with real geometry live in cad_parts.csv instead (see
# gen_cad_parts.py); listing a part in both places would double-count it.
#
# COORDINATE FRAME: millimeters, the STEP assembly frame. +z is the vehicle's
# long/thrust axis. Origin near the gimbal pivot. Useful landmarks measured
# from the CAD (docs/MASS_BUDGET.md has the full list):
#
#     z = -78    feet
#     z =  47    motor + propeller assembly
#     z =  90    gimbal rings
#     z = 143    lower body adapter
#     z = 150    body pipes (base; they run ~500 mm up)
#     z = 223    center body / body plate
#     z = 306    battery holder
#     z = 652    top of airframe
#
# `position_mm` for electronics is an ESTIMATE of where the part mounts --
# these are not in CAD, so nothing else can supply it. They are the largest
# remaining uncertainty in the inertia (748 g, more than half the vehicle),
# so revisit them once the vehicle is physically assembled. `estimated: true`
# marks a position that is a guess rather than a CAD-derived or measured value.

point_masses:
  # --- power: the heavy items, and the ones that most move the CG ---
  - name: "3S LiPo pack"
    mass_g: 307          # TODO stale: this is the 4200mAh pack; 2200mAh swap planned
    position_mm: [0, 0, 306]     # sits in the battery holder
    estimated: true
  - name: "PM07 power module"
    mass_g: 45
    position_mm: [0, 0, 275]     # inline with the battery leads
    estimated: true

  # --- avionics: clustered around the center body ---
  - name: "Pixhawk 6C + aluminum case"
    mass_g: 35
    position_mm: [0, 0, 223]     # on the center body / body plate
    estimated: true
  - name: "Pixhawk cables, vibration mount"
    mass_g: 30
    position_mm: [0, 0, 230]
    estimated: true
  - name: "Raspberry Pi 5 board"
    mass_g: 48
    position_mm: [0, 0, 250]
    estimated: true

  # --- motor electronics: mounted low, near the ESC/motor leads ---
  - name: "2x Hobbywing XRotor 40A ESC"
    mass_g: 37
    position_mm: [0, 0, 125]
    estimated: true
  - name: "2x Hobbywing UBEC 10A"
    mass_g: 62          # spreadsheet notes only 1 of 2 is actually used
    position_mm: [0, 0, 135]
    estimated: true

  # --- servos: real CAD positions are known (PTK8515:1 / :2), so these are
  #     NOT estimates. Kept here rather than in cad_parts.csv to avoid
  #     double-counting them against the 56 g spreadsheet line.
  - name: "PTK 8515 servo + horn (pitch)"
    mass_g: 28
    position_mm: [-2.9, 30.3, 113.0]
    estimated: false
  - name: "PTK 8515 servo + horn (roll)"
    mass_g: 28
    position_mm: [-46.4, -11.2, 80.4]
    estimated: false

  # --- telemetry / GPS: high up, GPS needs sky view ---
  - name: "Holybro M10 GPS + mount"
    mass_g: 53
    position_mm: [0, 0, 600]
    estimated: true
  - name: "Holybro SiK Radio V3"
    mass_g: 19
    position_mm: [0, 0, 450]
    estimated: true
  - name: "Receiver"
    mass_g: 6
    position_mm: [0, 0, 450]
    estimated: true

  # --- distributed hardware: no single location, placed at the rough
  #     centroid of the airframe so it neither inflates nor deflates inertia
  - name: "Leads, bolts, nuts, washers, inserts, tape, zip ties, XT60, wiring"
    mass_g: 50
    position_mm: [0, 0, 200]
    estimated: true

# Unmodeled remainder: mass known to exist from the weight budget but neither
# in cad_parts.csv nor itemized above. Set to null to disable. See
# docs/MASS_BUDGET.md for the reconciliation against the 1328 g design target.
design_total_mass_g: 1328
remainder_position_mm: [0, 0, 150]

# Optional hard override of the computed CG, for when a real balance-point
# measurement exists (balance the assembled vehicle on a knife edge). Leave
# null to let it be computed from the masses above -- which is now the
# default, since every item has a position.
center_of_mass_override_mm: null
