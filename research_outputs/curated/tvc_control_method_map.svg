  <g id="text_31">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(119.52 547.203938)">One black dot per paper, labeled by first author and publication year. Small offsets separate shared cells.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(119.52 557.281969)">*The bottom row is unclassified, not an evidence rank. Xie (2023) needs its experimental setup verified.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(119.52 567.36)">Empty columns describe this screened set only. Scope and source-depth qualifications are in the complete guide.</text>
