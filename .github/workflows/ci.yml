name: ci

# Two jobs, deliberately unequal in status.
#
# `unit` is the merge gate. Pure Python -- no ROS, no Gazebo, no display -- so it
# runs in seconds and is never flaky. Together with the explicit checks below,
# it guards the things this project
# cannot check by eye, all of which fail SILENTLY otherwise:
#
#   the axis convention                    a mistyped SDF joint name produces a
#                                          gimbal that never moves and reads as a
#                                          control bug
#   the generated artefacts                a documented or modelled number that
#                                          has drifted from vehicle_params.yaml
#   the frozen baseline                    a refactor that claimed to move no
#                                          numbers and moved some
#
# `sitl` is not a gate. Gazebo in CI is slow and flaky, and making it blocking
# before it has been green for a while trains people to ignore red.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest tests/ -q

      # The Gazebo model is generated from vehicle_params.yaml and must never be
      # hand-edited. --check re-solves base_link and fails if the file on disk
      # differs, or if the composite mass properties no longer reproduce the YAML.
      - name: The Gazebo model matches the parameters
        run: python tools/gen_model_sdf.py --check

      # Same rule for the numbers in docs/5-PARAMETERS.md. A documented number
      # that can drift from the source of truth is a number that will.
      - name: The documented numbers match the parameters
        run: python tools/gen_docs.py --check

      # The frozen numerical baseline. Any change here must be deliberate and
      # explained in its own commit -- see reference/golden/README.md.
      - name: Analytic baseline unchanged
        run: python tvc.py golden --check

      # Also run as a test, but run here too so the authority budget appears in
      # the CI log where a reviewer will see it.
      - name: Control scenarios
        run: python tvc.py validate --verbose

  sitl:
    # Non-blocking until it has been reliably green. Enable the schedule and drop
    # continue-on-error once that is true.
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder
        run: |
          echo "SITL job not yet implemented. All of this has been run by hand"
          echo "in the devcontainer and passes; what is missing is the CI image."
          echo "  colcon build --packages-select tvc_msgs tvc_control"
          echo "  ros2 launch tvc_control gazebo.launch.py gui:=false"
          echo "  bash gazebo/run_hover.sh --duration 30"
          echo "  python tvc.py hover --check-golden --unpause tvc_flight"
          echo ""
          echo "The last one is the point: it compares 14 metrics against"
          echo "reference/golden/hover_baseline.json. Until this job exists, a"
          echo "change that breaks the Gazebo flight is caught by a human"
          echo "remembering to fly it -- and the servo-gain bug that tumbled the"
          echo "vehicle survived a clean unit run, a clean colcon build and a"
          echo "review. See docs/7-CREDIBILITY.md."
