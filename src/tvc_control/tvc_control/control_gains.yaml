# =============================================================================
# control_gains.yaml -- what we CHOSE, as opposed to what we MEASURED.
# =============================================================================
# vehicle_params.yaml answers "what is the hardware?" -- it is measured, partly
# machine-written, and its provenance discipline is its whole value. Gains
# answer "what did we pick?" -- they change every tuning session and want A/B
# profiles. Mixing them means a tuning experiment dirties the file whose
# cleanliness matters most.
#
# UNITS. The rate loop outputs ANGULAR ACCELERATION [rad/s^2 per rad/s], not
# torque; inertia is applied once inside AttitudeController. This is what makes
# the two historical gain sets comparable -- sim/hover.py always wrote
# tau = I*KP_RATE*err and physics.py wrote tau = kp_rate*err, so the same name
# meant two things differing by a factor of I.
#
# Before adopting anything here, read docs/CREDIBILITY.md: only one of these
# profiles has ever been near a plant.

axis_convention: rocket_v2

profiles:

  # ---------------------------------------------------------------------------
  # The set that has actually flown, in Gazebo, repeatedly. Ported from
  # sim/hover.py's module constants, whose comments record the tuning history:
  # 6/15 gave zeta 0.79 and the position loop rang at its 9.5 rad/s natural
  # frequency, so 5/22 was chosen for zeta ~1.05; position 0.22/0.35 put the
  # two loops only 6.5x apart and produced a +/-9 deg coning limit cycle, so
  # 0.10/0.20 restored ~10x separation.
  #
  # CAVEAT, and it is not small: sim/hover.py models NO gimbal deadtime and NO
  # slew limit, while the analytic plant models both (30 ms, 403/235 deg/s).
  # 30 ms of pure delay at the ~9.5 rad/s crossover this implies costs roughly
  # 16 deg of phase margin that hover.py never paid. If this profile is less
  # stable here than there, that is a fact about the vehicle, not a porting bug.
  # ---------------------------------------------------------------------------
  flight_validated:
    attitude: {kp_angle: 5.0, kp_rate: 22.0, ki_rate: 0.0, kd_rate: 0.0, i_limit: 50.0}
    # hover.py's thrust-axis channel (it called this yaw): KP_YAW = 2.0 rad/s per rad, KD_YAW = 0.45 N.m per
    # rad/s -> 229.9 rad/s^2 per rad/s once the Iz = 0.001957 kg.m^2 is taken out.
    # The large number is not aggression, it is a small inertia.
    roll:    {kp_angle: 2.0, kp_rate: 229.9438, ki_rate: 0.0, kd_rate: 0.0, i_limit: 200.0}
    altitude: {kp_alt: 4.0, kp_vz: 3.0, ki_vz: 0.0, kd_vz: 0.0, i_limit_vz: 4.0, vz_max: 2.0}
    position: {kp_pos: 0.10, kd_pos: 0.20, max_tilt_deg: 8.0}

  # ---------------------------------------------------------------------------
  # The analytic simulator's historical defaults. Never flown, never tuned
  # against a plant. Kept so pre-existing plots and the golden reproduce, and as
  # the B side of any A/B.
  #
  # Known weakness, measured: on a ground-start climb this set lets the
  # thrust-axis channel reach a 66 deg excursion and take ~25 s to recover. The
  # rate gain is 0.88 rad/s^2 per rad/s against the flown set's 22.
  # ---------------------------------------------------------------------------
  analytic_legacy:
    attitude: {kp_angle: 4.0, kp_rate: 0.8843296781, ki_rate: 0.0884329678, kd_rate: 0.1768659356, i_limit: 22.1082419526}
    roll:    {kp_angle: 4.0, kp_rate: 0.9197751661, ki_rate: 0.0919775166, kd_rate: 0.1788451712, i_limit: 25.5493101686}
    altitude: {kp_alt: 1.5, kp_vz: 4.0, ki_vz: 1.0, kd_vz: 0.2, i_limit_vz: 4.0, vz_max: 2.0}
    position: {kp_pos: 0.10, kd_pos: 0.20, max_tilt_deg: 8.0}

# MEASURED, not assumed. The worry was that 30 ms of modelled gimbal deadtime --
# which sim/hover.py does not model -- would destabilise the flown set. It does
# not: A/B over lateral upset, roll upset and a ground climb shows no
# divergence and essentially no difference between 30 ms and 0 ms. It also halves
# the climb transient the analytic set suffers (66.4 -> 36.9 deg peak).
#
# The cost is steady-state error: 0.86 deg against 0.25 deg, because hover.py's
# set has ki = 0 on every axis. That is a real regression on a real metric and
# it is the next tuning question, not something to paper over by inventing an
# integral gain that has never flown.
default_profile: flight_validated
