# =============================================================================
# vehicle_params.yaml -- SINGLE SOURCE OF TRUTH for the TVC vehicle.
# =============================================================================
# Every simulator reads this file, so there is exactly one place to change a
# number and no way for the analytical sim (physics.py), the Gazebo model
# (model.sdf), and the hover controller (hover.py) to drift apart -- which is
# precisely the bug this file was created to kill.
#
# WHO WRITES WHAT
#   mass_properties:  REGENERATED by `python tools/mass_properties.py
#                     tools/components.yaml --emit sim/vehicle_params.yaml`.
#                     Do not hand-edit; edit tools/components.yaml (or set
#                     center_of_mass_override_mm there for a measured balance
#                     point) and re-emit. --emit rewrites ONLY this block.
#   everything else:  hand-maintained here (bench-data constants, limits, and
#                     the PWM maps the user will supply later).
#
# WHO READS IT
#   sim/vehicle_params.py     -- the loader (adds derived fields like L)
#   src/tvc_control/.../physics.py, sim/hover.py, gazebo_bridge_node.py
#   tools/gen_model_sdf.py    -- renders model.sdf from this file
# =============================================================================

# --- axis convention ---------------------------------------------------------
# Which naming this file's numbers are written in. See docs/CONVENTIONS.md.
#   legacy_quadcopter  body x = roll, body y = pitch, body z = yaw   <- today
#   rocket_v2          body z (thrust axis) = roll, x = pitch, y = yaw
# The loader rejects anything else rather than reinterpreting numbers under the
# wrong names, which is the failure a rename makes possible and silent.
axis_convention: legacy_quadcopter

# --- mass properties: REGENERATED by mass_properties.py --emit ---------------
# Authoritative design intent from tools/components.yaml + cad_parts.csv.
# Frame: millimeters, STEP assembly frame, origin at the gimbal pivot, +z up
# the thrust axis. Inertia tensor is about the CG, in kg*m^2.
# The block between the EMIT markers is rewritten by --emit; do not hand-edit it.
# <<<EMIT:mass_properties
mass_properties:
  mass_kg: 1.3280
  cg_mm: [-1.7, -1.0, 211.1]
  inertia_kg_m2:
    ixx: 0.022616
    iyy: 0.022581
    izz: 0.001957
    ixy: -0.000022
    ixz: -0.000301
    iyz: -0.000535
# >>>EMIT:mass_properties

# --- geometry / lever arm ----------------------------------------------------
# The coax rotors (where the multicopter motor model applies thrust) sit at a
# mean z of rotor_z_mm. Two ways to define the control lever arm L:
#   pivot        L = cg_z            (thrust modeled as acting at the pivot;
#                                     physics.py's original convention)
#   rotor_plane  L = cg_z - rotor_z  (thrust acts at the prop disc, which is
#                                     where Gazebo actually applies it)
# DECISION DEFERRED -- default keeps the original 'pivot' behavior. Flip to
# 'rotor_plane' to make both sims match Gazebo's true torque (~1.27x smaller).
geometry:
  rotor_z_mm: 45.0
  lever_arm_mode: pivot        # pivot | rotor_plane

# --- gimbal actuator ---------------------------------------------------------
# max_deg was 15.0 (a design-intent guess) until the bench sweep pinned the real
# travel at ~7 deg per axis. That halves lateral control authority:
# T_hov*L*sin(7 deg) = 0.335 N.m instead of 0.712 N.m, so any gain set tuned
# against 15 deg saturates roughly twice as early. tools/gen_model_sdf.py renders
# the SDF joint limits from max_deg -- regenerate model.sdf after changing it, or
# Gazebo and the analytic sim disagree about where the stops are.
#
# max_deg / rate_max_deg are the SYMMETRIC, WORST-CASE summary the SDF and the
# older code paths use. The measured per-axis detail is in `axes` below, and the
# two axes are genuinely different hardware -- do not average them.
gimbal:
  max_deg: 7.0                 # nominal symmetric limit (SDF + legacy consumers)
  rate_max_deg: 235.0          # slowest axis (outer); see axes.* for per-axis
  deadtime_s: 0.030            # servo transport delay, both axes (step: onset
                               # 10 ms, delay 30.5 ms, rise10-90 42 ms, ts2% 280 ms)

  # Per-axis bench data (2026 gimbal characterization).
  #   inner = the pitch-plane axis, delta1 in physics.py / dp in hover.py
  #   outer = the roll-plane axis,  delta2 in physics.py / dr in hover.py
  # (Joint chain: base_link -> gimbal_roll_joint -> outer_gimbal ->
  #  gimbal_pitch_joint -> inner_gimbal -> rotors. So the OUTER ring carries the
  #  roll-plane deflection and the INNER ring the pitch-plane one.)
  #
  # Travel is ASYMMETRIC on both axes -- neither centres on its own zero, and
  # the fitted neutral is ~4-5 us off the 1520 us nominal. Modeling a symmetric
  # +/-7 deg overstates travel on the negative side of both axes.
  #
  # theta_deg = gain_deg_per_us * (pwm - neutral_pwm)
  axes:
    inner:
      gain_deg_per_us: 0.037375     # = 19.435 deg per unit u, u=(P-1520)/520
      neutral_pwm: 1524.1
      min_deg: -6.46
      max_deg: 6.98
      rate_max_deg: 403.0           # measured peak slew
      bandwidth_hz: 13.0            # -3 dB
      resonance_db: 11.0            # lightly damped: a rate limit alone does
                                    # NOT reproduce this; see the note below
      phase_lag_2hz_deg: 40.0
      fit: {r2: 0.9977, rmse_deg: 0.197, mae_deg: 0.161,
            nonlinearity_pct_span: 3.61, hysteresis_mean_deg: 0.24,
            hysteresis_max_deg: 0.43}
    outer:
      gain_deg_per_us: 0.059912     # = 10.185 deg per unit u, u=(P-1520)/170
      neutral_pwm: 1525.3
      min_deg: -6.77
      max_deg: 6.86
      rate_max_deg: 235.0
      bandwidth_hz: 9.0
      resonance_db: 5.0
      phase_lag_2hz_deg: 53.0
      fit: {r2: 0.9942, rmse_deg: 0.312, mae_deg: 0.263,
            nonlinearity_pct_span: 6.61, hysteresis_mean_deg: 0.35,
            hysteresis_max_deg: 0.65}

# --- coax rotors / thrust (bench-calibrated; see docs/MASS_BUDGET.md) --------
rotors:
  max_rot_velocity: 1100.0     # rad/s, matches the SDF
  motor_constant: 7.35e-06     # N/(rad/s)^2, from 17.79 N combined at full throttle
  moment_constant: 0.016       # m, drag-torque / thrust -- SUPERSEDED by the
                               # measured surface below; kept because the Gazebo
                               # multicopter plugin and gen_model_sdf.py still
                               # consume it. It is a poor summary of the real
                               # coupling: the measured torque surface is not
                               # proportional to the thrust split (see below).
  thrust_at_max_n: 17.79       # N combined, both at PWM 2000 (measured surface)
  rotor_drag_coefficient: 8.06e-05
  rolling_moment_coefficient: 1.0e-06

  # --- axial (thrust-axis) reaction torque, a.k.a. tau_P ---------------------
  # Deliberately unbalancing the two coax props leaves a net prop drag torque
  # about the thrust axis. That torque is the ONLY authority the vehicle has
  # about body z (the gimbal has none), so it is a control input, not a
  # nuisance term. Its size is read off the measured surface below, NOT from
  # moment_constant: the headline "peak reaction torque 0.18 N.m" is measured at
  # A=2000/B=1000, where total thrust is only 10.4 N -- BELOW hover. What is
  # actually available at hover thrust is 0.151 N.m, and it collapses toward
  # zero as thrust approaches the 17.79 N ceiling. See axial_headroom().
  tau_p_max_nm: null           # optional hard cap; null -> read the surface

# --- measured actuator surface: (PWM A, PWM B) -> (thrust, axial torque) -----
# THE bench result this whole model rests on. 121-point sweep, both commands
# 1000-2000 us in 100 us steps, 4 s dwell, 50 Hz sampling; first 1 s of each
# dwell discarded (overshoot) and a dwell rejected when the least-squares slope
# over its last 3 s exceeded 0.3 (still settling). 119 of 121 points survived.
#
# WHY A SURFACE AND NOT TWO PER-MOTOR CURVES. In a coaxial pair the lower rotor
# runs inside the upper rotor's wake, so its thrust and drag torque depend on
# BOTH commands. A separable model T = T1(A) + T2(B) does not hold, and the fit
# shows it directly: the mixed terms are not small (-0.978*a*b in thrust,
# -0.479*a^2*b) and the two commands are not interchangeable -- +0.1797 N.m at
# A=1000/B=2000 against -0.1733 N.m at the mirrored A=2000/B=1000, with 11.18 N
# of thrust against 10.37 N. The asymmetry IS the wake.
#
# Normalization: a = (A - 1500)/500, b = (B - 1500)/500, both in [-1, 1].
# Coefficient order: [1, a, b, a^2, ab, b^2, a^3, a^2*b, a*b^2, b^3].
#
# NOTE ON THE SOURCE SLIDE: the R^2/RMSE/MAE lines are printed under the wrong
# surfaces there (the "0.243 N" pair belongs to thrust, the "0.0032 N.m" pair to
# torque). The values below are matched to the right surface. Sanity anchors
# that confirm the coefficients: F(1,1) = 17.79 N = the quoted peak thrust, and
# Tz(1,-1) = -0.173 N.m ~ the quoted 0.18 N.m peak reaction torque.
thrust_torque_surface:
  type: cubic_ab
  pwm_offset: 1500.0
  pwm_scale: 500.0
  pwm_min: 1000.0
  pwm_max: 2000.0
  thrust_n:  [ 6.876,  3.845,  4.999,  1.011, -0.978,  1.912,
               0.302, -0.479,  0.138,  0.168]
  torque_nm: [ 0.0017, -0.0795, 0.0870, -0.0277, 0.0030, 0.0322,
              -0.0089, -0.0033, 0.0043, 0.0087]
  fit:
    thrust: {r2: 0.9984, rmse_n: 0.243, mae_n: 0.194}
    torque: {r2: 0.9965, rmse_nm: 0.0032, mae_nm: 0.0025}

# --- measured motor dynamics / derating -------------------------------------
# Not consumed by the sim yet; recorded here so the numbers live with the rest
# of the vehicle rather than only on a slide.
#   response_delay_s   command -> thrust, averaged over 105 step transitions.
#                      3x the gimbal's 30 ms. The axial channel has ~5x the
#                      angular-acceleration authority of the lateral pair but a
#                      3x slower actuator, so it is authority-rich and
#                      bandwidth-poor -- the opposite of what the inertia ratio
#                      alone suggests, and the reason its gains cannot simply be
#                      scaled up by Ix/Iz.
#   sustained load     7 x 60 s repeats: pack 11.9 -> 10.0 V, thrust 13.8 ->
#                      12.0 N (-13%). The surface above is a fresh-pack fit; a
#                      long flight loses authority against it.
motor_dynamics:
  response_delay_s: 0.10
  peak_current_a: 34.7
  efficiency_g_per_w: 4.9
  thrust_sensitivity_n_per_v: 1.46     # r = 0.981 over 11.2-12.5 V
  sustained_load:
    voltage_start_v: 11.9
    voltage_end_v: 10.0
    thrust_start_n: 13.8
    thrust_end_n: 12.0

# --- environment -------------------------------------------------------------
env:
  gravity: 9.81

# --- PWM maps: POPULATED LATER from bench data -------------------------------
# Until filled, the sims fall back to the simple thrust = k*omega^2 / servo =
# radians model. When the user supplies data, choose ONE representation per map:
#   type: poly      coeffs: [c0, c1, ...]   value = sum(c_i * pwm^i)
#   type: table     pwm: [...]  value: [...]   (monotonic; linearly interpolated)
# See sim/actuator_maps.py for how these are consumed.
pwm_thrust_map:
  type: null                   # -> null falls back to k*omega^2
  # thrust in NEWTONS (combined) as a function of PWM microseconds
pwm_servo_map:
  type: null                   # -> null falls back to command == radians
  # gimbal deflection in RADIANS as a function of PWM microseconds
