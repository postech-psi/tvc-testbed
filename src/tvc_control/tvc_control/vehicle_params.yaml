# =============================================================================
# vehicle_params.yaml -- SINGLE SOURCE OF TRUTH for the TVC vehicle.
# =============================================================================
# EVERY number describing the hardware lives here and nowhere else, so there is
# exactly one place to change one and no way for the analytic plant, the Gazebo
# model and the documentation to drift apart. There is NO FALLBACK anywhere: if
# this file is missing or unreadable the loader raises, because a default that
# can silently disagree with a measurement eventually will. (A superseded 20.0 N
# max thrust once survived in three separate files after the bench measured
# 17.79 N. Nothing failed; the simulation just described a different vehicle.)
#
# What we CHOSE, as opposed to what we MEASURED, is in control_gains.yaml. Gains
# change every tuning session and want A/B profiles; mixing them in here would
# mean a tuning experiment dirties the file whose provenance is its whole value.
#
# WHO WRITES WHAT
#   mass_properties:  MACHINE-WRITTEN. Regenerate with
#                       python tools/mass_properties.py tools/components.yaml \
#                              --emit src/tvc_control/tvc_control/vehicle_params.yaml
#                     Do not hand-edit it; edit tools/components.yaml (or set
#                     center_of_mass_override_mm there for a measured balance
#                     point) and re-emit. --emit rewrites ONLY the block between
#                     the EMIT sentinels, preserving every comment around it.
#   everything else:  hand-maintained bench data.
#
# WHO READS IT
#   tvc_control/config.py     the only loader; everything else goes through it
#   tools/gen_model_sdf.py    generates gazebo/models/tvc_vehicle/model.sdf
#   tools/gen_docs.py         generates the tables in docs/5-PARAMETERS.md
#   Both generators have a --check mode, and CI runs both.
#
# Provenance of each number, with its uncertainty: docs/5-PARAMETERS.md.
# =============================================================================

# --- axis convention ---------------------------------------------------------
# Which naming this file's numbers are written in. See docs/4-CONVENTIONS.md.
#
#   rocket_v2   roll = body z (the thrust axis), pitch = body x, yaw = body y
#
# The loader REJECTS any other token rather than reinterpreting these numbers
# under the wrong names. That is the failure an axis rename makes both possible
# and silent: the identifiers survive, the meanings change, nothing errors.
axis_convention: rocket_v2

# --- mass properties: REGENERATED by mass_properties.py --emit ---------------
# Authoritative design intent from tools/components.yaml + cad_parts.csv.
# Frame: millimeters, STEP assembly frame, origin at the gimbal pivot, +z up
# the thrust axis. Inertia tensor is about the CG, in kg*m^2.
# The block between the EMIT markers is rewritten by --emit; do not hand-edit it.
# <<<EMIT:mass_properties
mass_properties:
  mass_kg: 1.3280
  cg_mm: [-1.7, -1.0, 211.1]
  inertia_kg_m2:
    ixx: 0.022616
    iyy: 0.022581
    izz: 0.001957
    ixy: -0.000022
    ixz: -0.000301
    iyz: -0.000535
# >>>EMIT:mass_properties

# --- geometry / lever arm ----------------------------------------------------
# The coax rotors (where the multicopter motor model applies thrust) sit at a
# mean z of rotor_z_mm. Two ways to define the control lever arm L:
#   pivot        L = cg_z            = 211 mm; thrust modelled as acting at the
#                                     gimbal pivot. The original convention.
#   rotor_plane  L = cg_z - rotor_z  = 166 mm; thrust acts at the prop disc,
#                                     which is where Gazebo actually applies it.
#
# DECISION DEFERRED, and it is not a small one: the choice is worth 21% of ALL
# lateral control authority. Nothing in the bench data settles it; a measurement
# of where the thrust resultant acts would. Default keeps 'pivot'.
geometry:
  rotor_z_mm: 45.0
  lever_arm_mode: pivot        # pivot | rotor_plane

# --- gimbal actuator ---------------------------------------------------------
# max_deg was 15.0 (a design-intent guess) until the bench sweep pinned the real
# travel at ~7 deg per axis. That halves lateral control authority:
# T_hov*L*sin(7 deg) = 0.335 N.m instead of 0.712 N.m, so any gain set tuned
# against 15 deg saturates roughly twice as early. tools/gen_model_sdf.py renders
# the SDF joint limits from max_deg -- regenerate model.sdf after changing it, or
# Gazebo and the analytic sim disagree about where the stops are.
#
# max_deg / rate_max_deg are the SYMMETRIC, WORST-CASE summary the SDF and the
# older code paths use. The measured per-axis detail is in `axes` below, and the
# two axes are genuinely different hardware -- do not average them.
gimbal:
  max_deg: 7.0                 # nominal symmetric limit (SDF + legacy consumers)
  rate_max_deg: 235.0          # slowest axis (outer); see axes.* for per-axis
  deadtime_s: 0.030            # servo transport delay, both axes (step: onset
                               # 10 ms, delay 30.5 ms, rise10-90 42 ms, ts2% 280 ms)

  # Per-axis bench data (2026 gimbal characterization).
  #   inner = the yaw-plane ring,   delta1, rotates about body y
  #   outer = the pitch-plane ring, delta2, rotates about body x
  # (Joint chain: base_link -> gimbal_outer_joint -> outer_gimbal ->
  #  gimbal_inner_joint -> inner_gimbal -> rotors. So the OUTER ring carries the
  #  pitch-plane deflection and the INNER ring the yaw-plane one.)
  #
  # Travel is ASYMMETRIC on both axes -- neither centres on its own zero, and
  # the fitted neutral is ~4-5 us off the 1520 us nominal. Modeling a symmetric
  # +/-7 deg overstates travel on the negative side of both axes.
  #
  # theta_deg = gain_deg_per_us * (pwm - neutral_pwm)
  axes:
    inner:
      gain_deg_per_us: 0.037375     # = 19.435 deg per unit u, u=(P-1520)/520
      neutral_pwm: 1524.1
      min_deg: -6.46
      max_deg: 6.98
      rate_max_deg: 403.0           # measured peak slew
      bandwidth_hz: 13.0            # -3 dB
      resonance_db: 11.0            # lightly damped: a rate limit alone does
                                    # NOT reproduce this; see the note below
      phase_lag_2hz_deg: 40.0
      fit: {r2: 0.9977, rmse_deg: 0.197, mae_deg: 0.161,
            nonlinearity_pct_span: 3.61, hysteresis_mean_deg: 0.24,
            hysteresis_max_deg: 0.43}
    outer:
      gain_deg_per_us: 0.059912     # = 10.185 deg per unit u, u=(P-1520)/170
      neutral_pwm: 1525.3
      min_deg: -6.77
      max_deg: 6.86
      rate_max_deg: 235.0
      bandwidth_hz: 9.0
      resonance_db: 5.0
      phase_lag_2hz_deg: 53.0
      fit: {r2: 0.9942, rmse_deg: 0.312, mae_deg: 0.263,
            nonlinearity_pct_span: 6.61, hysteresis_mean_deg: 0.35,
            hysteresis_max_deg: 0.65}

# --- coax rotors / thrust (bench-calibrated; provenance in docs/MASS-BUDGET.md)
rotors:
  # SOLVER CONSTANTS, not physics. Since the Gazebo path now inverts the
  # plugin's own algebra to reproduce the measured surface exactly (see
  # tvc_control/hal/gazebo.py), rotor speed in simulation is a control
  # allocation variable and these two are the scaling that makes the inversion
  # feasible over the whole measured envelope. At the original 1100 / 0.016 no
  # single moment_constant covers it -- the requirement diverges near full
  # thrust. At 1200+ it converges to 0.0323, so 1300 / 0.04 leaves margin.
  # Nothing may read simulated rotor omega as a physical RPM.
  max_rot_velocity: 1300.0     # rad/s, solver headroom (was 1100 = physical)
  motor_constant: 7.35e-06     # N/(rad/s)^2, from 17.79 N combined at full throttle
  moment_constant: 0.04        # m, solver scaling -- SUPERSEDED as physics by the
                               # measured surface below; kept because the Gazebo
                               # multicopter plugin and gen_model_sdf.py still
                               # consume it. It is a poor summary of the real
                               # coupling: the measured torque surface is not
                               # proportional to the thrust split (see below).
  thrust_at_max_n: 17.79       # N combined, both at PWM 2000 (measured surface)
  # Zeroed for plant parity. Both produce body-velocity-dependent wrenches that
  # scale with the now-fictitious rotor speed, and the analytic plant models
  # neither. They were estimates, not measurements, so nothing measured is lost.
  rotor_drag_coefficient: 0.0
  rolling_moment_coefficient: 0.0

  # --- roll (thrust-axis) reaction torque, a.k.a. tau_P ---------------------
  # Deliberately unbalancing the two coax props leaves a net prop drag torque
  # about the thrust axis. That torque is the ONLY authority the vehicle has
  # about body z (the gimbal has none), so it is a control input, not a
  # nuisance term. Its size is read off the measured surface below, NOT from
  # moment_constant: the headline "peak reaction torque 0.18 N.m" is measured at
  # A=2000/B=1000, where total thrust is only 10.4 N -- BELOW hover. What is
  # actually available at hover thrust is 0.151 N.m, and it collapses toward
  # zero as thrust approaches the 17.79 N ceiling. See roll_headroom().
  tau_p_max_nm: null           # optional hard cap; null -> read the surface

# --- measured actuator surface: (PWM A, PWM B) -> (thrust, roll torque) -----
# THE bench result this whole model rests on. 121-point sweep, both commands
# 1000-2000 us in 100 us steps, 4 s dwell, 50 Hz sampling; first 1 s of each
# dwell discarded (overshoot) and a dwell rejected when the least-squares slope
# over its last 3 s exceeded 0.3 (still settling). 119 of 121 points survived.
#
# WHY A SURFACE AND NOT TWO PER-MOTOR CURVES. In a coaxial pair the lower rotor
# runs inside the upper rotor's wake, so its thrust and drag torque depend on
# BOTH commands. A separable model T = T1(A) + T2(B) does not hold, and the fit
# shows it directly: the mixed terms are not small (-0.978*a*b in thrust,
# -0.479*a^2*b) and the two commands are not interchangeable -- +0.1797 N.m at
# A=1000/B=2000 against -0.1733 N.m at the mirrored A=2000/B=1000, with 11.18 N
# of thrust against 10.37 N. The asymmetry IS the wake.
#
# Normalization: a = (A - 1500)/500, b = (B - 1500)/500, both in [-1, 1].
# Coefficient order: [1, a, b, a^2, ab, b^2, a^3, a^2*b, a*b^2, b^3].
#
# NOTE ON THE SOURCE SLIDE: the R^2/RMSE/MAE lines are printed under the wrong
# surfaces there (the "0.243 N" pair belongs to thrust, the "0.0032 N.m" pair to
# torque). The values below are matched to the right surface. Sanity anchors
# that confirm the coefficients: F(1,1) = 17.79 N = the quoted peak thrust, and
# Tz(1,-1) = -0.173 N.m ~ the quoted 0.18 N.m peak reaction torque.
thrust_torque_surface:
  type: cubic_ab
  pwm_offset: 1500.0
  pwm_scale: 500.0
  pwm_min: 1000.0
  pwm_max: 2000.0
  thrust_n:  [ 6.876,  3.845,  4.999,  1.011, -0.978,  1.912,
               0.302, -0.479,  0.138,  0.168]
  torque_nm: [ 0.0017, -0.0795, 0.0870, -0.0277, 0.0030, 0.0322,
              -0.0089, -0.0033, 0.0043, 0.0087]
  fit:
    thrust: {r2: 0.9984, rmse_n: 0.243, mae_n: 0.194}
    torque: {r2: 0.9965, rmse_nm: 0.0032, mae_nm: 0.0025}

# --- measured motor dynamics / derating -------------------------------------
# Not consumed by the sim yet; recorded here so the numbers live with the rest
# of the vehicle rather than only on a slide.
#   response_delay_s   command -> thrust, averaged over 105 step transitions.
#                      3x the gimbal's 30 ms. The roll channel has ~5x the
#                      angular-acceleration authority of the lateral pair but a
#                      3x slower actuator, so it is authority-rich and
#                      bandwidth-poor -- the opposite of what the inertia ratio
#                      alone suggests, and the reason its gains cannot simply be
#                      scaled up by Ix/Iz.
#   sustained load     7 x 60 s repeats: pack 11.9 -> 10.0 V, thrust 13.8 ->
#                      12.0 N (-13%). The surface above is a fresh-pack fit; a
#                      long flight loses authority against it.
motor_dynamics:
  # HOW the 100 ms is modelled, and the honest reason there is a switch.
  #
  # The bench record says "command -> thrust response delay ~0.10 s, averaged
  # over 105 step transitions" and -- unlike the gimbal block, which separates
  # onset / delay / rise10-90 / settle -- it does not say whether that is a
  # transport DELAY or a first-order TIME CONSTANT. The difference is not
  # cosmetic: a pure delay eats phase at every frequency and cannot be
  # lead-compensated, so the usable roll-channel gain differs materially
  # between the two readings.
  #
  #   first_order    T, tau_P follow their commands with time constant tau_s
  #   delay          they follow exactly, deadtime_s late
  #   delay_plus_lag both
  #
  # Default is the optimistic reading. Run the pessimistic one before trusting
  # any roll-channel stability margin -- `python tvc.py validate` runs both and
  # prints the pessimistic number every time. Resolving this needs ONE BENCH RUN,
  # not a modelling decision. It is the highest-value measurement outstanding.
  model: first_order
  tau_s: 0.10
  deadtime_s: 0.0

  # What Gazebo's MulticopterMotorModel should use. Near-zero on purpose: the
  # lag is owned by the plant model above, in ONE place, so the two plants agree.
  # It cannot live in the plugin anyway -- the plugin filters the rotor VELOCITY
  # reference, and since T ~ omega^2 a first-order lag in omega is not a
  # first-order lag in thrust; it is faster near hover and asymmetric between
  # spin-up and spin-down.
  gazebo_time_constant_s: 0.001

  response_delay_s: 0.10       # as measured, kept for provenance
  peak_current_a: 34.7
  efficiency_g_per_w: 4.9
  thrust_sensitivity_n_per_v: 1.46     # r = 0.981 over 11.2-12.5 V
  sustained_load:
    voltage_start_v: 11.9
    voltage_end_v: 10.0
    thrust_start_n: 13.8
    thrust_end_n: 12.0

# --- environment -------------------------------------------------------------
env:
  gravity: 9.81

# --- PWM maps: SUPERSEDED, kept only as a tombstone ---------------------------
# These predate the measured data. Both are now covered by better models:
#   pwm_thrust_map -> thrust_torque_surface above, which is a TWO-input surface
#                     because a coax pair is not separable (see its comment).
#   pwm_servo_map  -> gimbal.axes.*, which is per ring because the two rings are
#                     different hardware.
# Nothing reads them. They are left here, empty and labelled, rather than
# deleted, so that a reader who finds `pwm_thrust_map` in an old branch or an old
# document can see immediately that it was replaced rather than lost.
pwm_thrust_map:
  type: null                   # superseded by thrust_torque_surface
pwm_servo_map:
  type: null                   # superseded by gimbal.axes
