# Where `colcon build` puts this package's console_scripts entry points, so
# `ros2 run tvc_control <node>` can find them. ROS 2's own package template
# writes these keys dash-separated (script-dir / install-scripts); setuptools
# still accepts that spelling but warns on every build that it will not forever.
# Underscores are the supported form and mean exactly the same thing.
[develop]
script_dir=$base/lib/tvc_control
[install]
install_scripts=$base/lib/tvc_control
